services:
  frontend:
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    build:
      context: .
    container_name: box-inventory-front
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://localhost:5000}
      AUTH_AUTHORITY: ${AUTH_AUTHORITY:-https://sso.allue.eu/realms/master}
      AUTH_CLIENT_ID: ${AUTH_CLIENT_ID:-inventory-front}
      AUTH_REDIRECT_URL: ${AUTH_REDIRECT_URL:-http://localhost:4200/auth-callback}
      AUTH_POST_LOGOUT_URI: ${AUTH_POST_LOGOUT_URI:-http://localhost:4200}
      AUTH_SCOPE: ${AUTH_SCOPE:-openid profile email}
      SILENT_RENEW: ${SILENT_RENEW:-true}
      USE_REFRESH_TOKEN: ${USE_REFRESH_TOKEN:-true}

  api:
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    build:
      context: ${API_CONTEXT:-.}
      dockerfile: ${API_DOCKERFILE:-Dockerfile}
    container_name: box-inventory-api
    ports:
      - "${API_PORT:-5000}:5000"
    environment:
      ASPNETCORE_URLS: ${ASPNETCORE_URLS:-http://+:5000}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      MongoDb__ConnectionString: ${MONGO_CONNECTION_STRING:-mongodb://mongodb:27017}
      MongoDb__DatabaseName: ${MONGO_DATABASE:-box_inventory}
      Jwt__Authority: ${AUTH_AUTHORITY:-https://sso.allue.eu/realms/master}
      Jwt__Audience: ${JWT_AUDIENCE:-account}
      Jwt__RequireHttpsMetadata: ${JWT_REQUIRE_HTTPS:-true}
      Cors__AllowedOrigins__0: ${CORS_ORIGIN:-*}
    depends_on:
      mongodb:
        condition: service_started
    restart: unless-stopped

  mongodb:
    image: mongo:6.0
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    container_name: box-inventory-mongo
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
