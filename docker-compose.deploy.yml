services:
  frontend:
    build:
      context: .
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  api:
    image: ${API_IMAGE:-inventory-api:latest}
    build:
      context: ${API_CONTEXT:-../inventory-api}
      dockerfile: ${API_DOCKERFILE:-Dockerfile}
    expose:
      - "5000"
    environment:
      - ASPNETCORE_URLS=http://+:5000
      - ASPNETCORE_ENVIRONMENT=Production
    restart: unless-stopped
