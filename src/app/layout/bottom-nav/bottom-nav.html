<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-2 py-3 bg-surface-container shadow-[0_-4px_12px_0_rgba(4,22,50,0.08)] rounded-t-xl">
  <a class="flex flex-col items-center justify-center px-4 py-1 hover:text-primary transition-colors active:scale-90 duration-200 text-on-surface-variant"
     routerLink="/boxes"
     routerLinkActive="nav-active"
     [routerLinkActiveOptions]="{exact: true}">
    <span class="material-symbols-outlined">package_2</span>
    <span class="text-label-sm mt-1">Cajas</span>
  </a>
  <a class="desktop-only flex-col items-center justify-center px-4 py-1 hover:text-primary transition-colors active:scale-90 duration-200 text-on-surface-variant"
     routerLink="/zones"
     routerLinkActive="nav-active"
     [routerLinkActiveOptions]="{exact: true}">
    <span class="material-symbols-outlined">shelves</span>
    <span class="text-label-sm mt-1">Zonas</span>
  </a>
  <a class="flex flex-col items-center justify-center px-4 py-1 hover:text-primary transition-colors active:scale-90 duration-200 text-on-surface-variant"
     routerLink="/search"
     routerLinkActive="nav-active"
     [routerLinkActiveOptions]="{exact: true}">
    <span class="material-symbols-outlined">search</span>
    <span class="text-label-sm mt-1">Búsqueda</span>
  </a>
  <button class="mobile-only flex-col items-center justify-center px-4 py-1 hover:text-primary transition-colors active:scale-90 duration-200 text-on-surface-variant"
     (click)="toggleDrawer()">
    <span class="material-symbols-outlined">menu</span>
    <span class="text-label-sm mt-1">Más</span>
  </button>
  <a class="desktop-only flex-col items-center justify-center px-4 py-1 hover:text-primary transition-colors active:scale-90 duration-200 text-on-surface-variant"
     routerLink="/logs"
     routerLinkActive="nav-active"
     [routerLinkActiveOptions]="{exact: true}">
    <span class="material-symbols-outlined">swap_horiz</span>
    <span class="text-label-sm mt-1">Movimientos</span>
  </a>
  <a class="desktop-only flex-col items-center justify-center px-4 py-1 hover:text-primary transition-colors active:scale-90 duration-200 text-on-surface-variant"
     routerLink="/import"
     routerLinkActive="nav-active"
     [routerLinkActiveOptions]="{exact: true}">
    <span class="material-symbols-outlined">upload_file</span>
    <span class="text-label-sm mt-1">Importar</span>
  </a>
</nav>

@if (drawerOpen()) {
  <div class="fixed top-0 left-0 w-full h-full z-50 pointer-events-none">
    <div class="drawer-backdrop absolute top-0 left-0 w-full h-full pointer-events-auto" (click)="closeDrawer()"></div>
    <div class="drawer-panel absolute bottom-0 left-0 w-full pointer-events-auto bg-surface-bright px-4 pt-4">
      <div class="drawer-pull-bar"></div>
      <div class="flex flex-col gap-1">
        <a class="drawer-item"
           routerLink="/zones"
           routerLinkActive="text-secondary"
           (click)="closeDrawer()">
          <span class="material-symbols-outlined">shelves</span>
          <span class="text-body-md">Zonas</span>
        </a>
        <a class="drawer-item"
           routerLink="/logs"
           routerLinkActive="text-secondary"
           (click)="closeDrawer()">
          <span class="material-symbols-outlined">swap_horiz</span>
          <span class="text-body-md">Movimientos</span>
        </a>
        <a class="drawer-item"
           routerLink="/import"
           routerLinkActive="text-secondary"
           (click)="closeDrawer()">
          <span class="material-symbols-outlined">upload_file</span>
          <span class="text-body-md">Importar</span>
        </a>
      </div>
    </div>
  </div>
}
